<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d2045" />
  <meta name="description" content="Pokédex de Broken: consulta los 386 Pokémon de Kanto, Johto y Hoenn, sus habilidades, estadísticas, tipos, evoluciones y movimientos." />
  <title>Pokédex de Broken | 386 Pokémon</title>
  <link rel="stylesheet" href="styles.css?v=2" />
  <script src="pokemon-data.js?v=2" defer></script>
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <div class="landscape" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="topbar">
      <span class="pokeball" aria-hidden="true">◉</span>
      <div class="brand-stack">
        <h1>POKÉDEX DE BROKEN</h1>
        <span class="brand-sub">KANTO · JOHTO · HOENN</span>
      </div>
      <span class="total-count"><b>386</b> Pokémon</span>
    </header>
    <section class="toolbar" aria-label="Buscar y filtrar Pokémon">
      <label class="searchbox"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar por nombre o número..." autocomplete="off" /></label>
      <select id="region" aria-label="Filtrar por región">
        <option value="all">Todas las regiones</option>
        <option value="kanto">Kanto · 001–151</option>
        <option value="johto">Johto · 152–251</option>
        <option value="hoenn">Hoenn · 252–386</option>
      </select>
      <select id="type" aria-label="Filtrar por tipo"><option value="all">Todos los tipos</option></select>
    </section>
    <div class="grid-head"><p class="results" id="results" aria-live="polite"></p><span class="source-label">Datos Pokémon: PokéAPI · Sprites: PokéAPI</span></div>
    <section class="pokedex-grid" id="grid" aria-label="Lista de Pokémon"></section>
    <footer>Pokédex de Broken · 386 Pokémon · Datos oficiales de referencia · Proyecto independiente de los juegos oficiales.</footer>
  </main>
  <div class="modal-backdrop" id="backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-name" tabindex="-1">
      <div class="modal-top">
        <div class="modal-brand">◉ POKÉDEX DE BROKEN <span>/ Ficha Pokémon</span></div>
        <button class="close" id="close" type="button" aria-label="Cerrar ficha">✕ Cerrar</button>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </div>
  </div>
</body>
</html>
